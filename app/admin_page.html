<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Restaurant Voice Agent — Admin</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2f3a; --txt:#e6e8ec; --mut:#8b93a1; --acc:#4f8cff; --ok:#3ecf8e; --bad:#ff5d5d; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; }
  .wrap { display:grid; grid-template-columns:1fr 1fr; gap:20px; padding:24px; }
  @media (max-width:900px){ .wrap{ grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card h2 { margin:0 0 12px; font-size:14px; color:var(--mut); text-transform:uppercase; letter-spacing:.04em; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:600; }
  input,select,button { font:inherit; border-radius:8px; border:1px solid var(--line); background:#11141a; color:var(--txt); padding:8px 10px; }
  input:focus,select:focus { outline:1px solid var(--acc); }
  button { cursor:pointer; background:var(--acc); color:#03101f; border:none; font-weight:600; }
  button.ghost { background:transparent; color:var(--mut); border:1px solid var(--line); }
  button.danger { background:transparent; color:var(--bad); border:1px solid var(--bad); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px; }
  .row > div { display:flex; flex-direction:column; gap:4px; }
  .row label { color:var(--mut); font-size:12px; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tabs button { background:transparent; color:var(--mut); border:1px solid var(--line); }
  .tabs button.active { background:var(--acc); color:#03101f; }
  .pill { font-size:11px; padding:2px 8px; border-radius:99px; background:#222732; color:var(--mut); }
  .pill.paid { background:rgba(62,207,142,.15); color:var(--ok); }
  .pill.sent { background:rgba(79,140,255,.15); color:var(--acc); }
  .muted { color:var(--mut); }
  .actions { display:flex; gap:6px; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ok); color:#03101f; padding:10px 18px; border-radius:8px; font-weight:600; opacity:0; transition:.25s; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header><h1>🍽️ Voice Agent Admin</h1><span class="muted" id="who"></span></header>
<div class="wrap">
  <!-- MENU -->
  <div class="card">
    <h2>Menu</h2>
    <form id="addForm" class="row">
      <div><label>Name</label><input id="m_name" required placeholder="Garlic Knots"></div>
      <div><label>Category</label>
        <select id="m_cat">
          <option>starters</option><option>mains</option><option>desserts</option><option>drinks</option>
        </select>
      </div>
      <div><label>Price ($)</label><input id="m_price" type="number" step="0.01" min="0" required placeholder="5.00" style="width:90px"></div>
      <button type="submit">+ Add</button>
    </form>
    <table id="menuTable">
      <thead><tr><th>Item</th><th>Category</th><th>Price</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- ORDERS + RESERVATIONS -->
  <div class="card">
    <h2>Live Activity</h2>
    <div class="tabs">
      <button data-tab="orders" class="active">Orders</button>
      <button data-tab="res">Reservations</button>
    </div>
    <div id="tab-orders">
      <table id="orderTable">
        <thead><tr><th>When</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="tab-res" style="display:none">
      <table id="resTable">
        <thead><tr><th>When</th><th>Customer</th><th>Party</th><th>Date/Time</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const fmt = (iso) => iso ? new Date(iso).toLocaleString() : "";
let editingId = null;

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }

async function getJSON(url){
  const r = await fetch(url, { headers:{ "Accept":"application/json" } });
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sendJSON(url, method, body){
  const r = await fetch(url, { method, headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

async function loadMenu(){
  const items = await getJSON("/admin/api/menu");
  const tb = $("#menuTable tbody"); tb.innerHTML = "";
  items.forEach(it => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${it.name}</td><td>${it.category}</td><td>$${Number(it.price).toFixed(2)}</td>
      <td class="actions"><button class="ghost" data-edit="${it.id}">Edit</button>
      <button class="danger" data-del="${it.id}">✕</button></td>`;
    tb.appendChild(tr);
  });
}

async function loadOrders(){
  const orders = await getJSON("/admin/api/orders");
  const tb = $("#orderTable tbody"); tb.innerHTML = "";
  orders.slice().reverse().forEach(o => {
    const items = o.items.map(i => `${i.quantity}× ${i.name||i.item_id}`).join(", ");
    const cls = o.status==="paid" ? "paid" : (o.status==="payment_sent" ? "sent" : "");
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="muted">${fmt(o.created_at)}</td><td>${o.customer_name}<br><span class="muted">${o.phone}</span></td>
      <td>${items}</td><td>$${Number(o.total).toFixed(2)}</td><td><span class="pill ${cls}">${o.status}</span></td>`;
    tb.appendChild(tr);
  });
}

async function loadReservations(){
  const res = await getJSON("/admin/api/reservations");
  const tb = $("#resTable tbody"); tb.innerHTML = "";
  res.slice().reverse().forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="muted">${fmt(r.created_at)}</td><td>${r.customer_name}<br><span class="muted">${r.phone}</span></td>
      <td>${r.party_size}</td><td>${r.date} ${r.time}</td>`;
    tb.appendChild(tr);
  });
}

$("#addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = { name: $("#m_name").value, category: $("#m_cat").value, price: parseFloat($("#m_price").value) };
  if(editingId){
    await sendJSON("/admin/api/menu", "PUT", { id: editingId, ...data });
    editingId = null; $("#addForm button[type=submit]").textContent = "+ Add";
  } else {
    await sendJSON("/admin/api/menu", "POST", data);
  }
  e.target.reset(); loadMenu(); toast("Saved");
});

$("#menuTable").addEventListener("click", async (e) => {
  const del = e.target.getAttribute("data-del");
  const edit = e.target.getAttribute("data-edit");
  if(del){ if(confirm("Delete this item?")){ await sendJSON("/admin/api/menu","DELETE",{id:del}); loadMenu(); toast("Deleted"); } }
  if(edit){
    const it = (await getJSON("/admin/api/menu")).find(x=>x.id===edit);
    $("#m_name").value = it.name; $("#m_cat").value = it.category; $("#m_price").value = it.price;
    editingId = edit; $("#addForm button[type=submit]").textContent = "Save";
  }
});

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  $("#tab-orders").style.display = b.dataset.tab==="orders" ? "" : "none";
  $("#tab-res").style.display = b.dataset.tab==="res" ? "" : "none";
}));

(async () => {
  await loadMenu(); await loadOrders(); await loadReservations();
  setInterval(async () => { try { await loadOrders(); await loadReservations(); } catch(_){} }, 8000);
})();
</script>
</body>
</html>

[build]
builder = "nixpacks"
watchPatterns = ["/app"]

[deploy]
# Wrap in sh -c so $PORT expands at runtime (Railway injects it). Plain
# 'uvicorn ... --port $PORT' is executed without shell expansion and crashes
# with "'$PORT' is not a valid integer".
startCommand = "sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
